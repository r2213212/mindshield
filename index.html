<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindShield AI - Achievement Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        body { background-color: #050a10; color: #00f2ff; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 15px; }
        .header { text-align: center; margin-bottom: 15px; }
        h1 { margin: 0; letter-spacing: 2px; font-size: 2rem; }
        
        .main-layout { display: flex; flex-direction: row; gap: 15px; width: 100%; max-width: 1200px; }
        #input_video { display: none; }

        /* 監控區域 */
        .monitor-screen { flex: 2; background: #000; border-radius: 20px; border: 2px solid #1f2937; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        canvas { width: 100%; height: auto; }

        /* 右側控制台 */
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 15px; text-align: center; }
        
        /* 成就系統樣式 */
        .xp-text { font-size: 2rem; font-weight: bold; color: #fbbf24; }
        .level-badge { background: #fbbf24; color: #000; padding: 2px 10px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; }
        .score-large { font-size: 3rem; font-weight: 800; color: #fff; }

        /* 按鈕 */
        .btn { padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-start { background: #00f2ff; color: #000; }
        .btn-stop { background: transparent; border: 1px solid #ef4444; color: #ef4444; margin-top: 8px; }
        .btn-start:disabled { background: #374151; color: #9ca3af; }

        .warning-msg { color: #ef4444; font-weight: bold; display: none; margin-top: 5px; animation: flash 0.8s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        @media (max-width: 900px) { .main-layout { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>MINDSHIELD <span class="level-badge" id="user-level">LV.1 ROOKIE</span></h1>
    </div>

    <div class="main-layout">
        <video id="input_video"></video>
        
        <div class="monitor-screen">
            <canvas id="output_canvas" width="640" height="480"></canvas>
            <div id="loading-overlay" style="position: absolute; background: rgba(0,0,0,0.8); width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
                AI 模型載入中...
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <div style="font-size: 0.8rem; color: #9ca3af;">FOCUS POINTS (XP)</div>
                <div class="xp-text" id="xp-points">0</div>
                <div style="font-size: 0.7rem; color: #fbbf24;" id="next-level">Next Level: 500 XP</div>
            </div>

            <div class="card">
                <div style="font-size: 0.8rem; color: #9ca3af;">FOCUS INDEX</div>
                <div class="score-large" id="focus-index">0%</div>
                <div id="phone-warning" class="warning-msg">⚠️ DETECTED MOBILE PHONE</div>
            </div>

            <div class="card" style="background: transparent; border: none; padding: 0;">
                <button class="btn btn-start" id="start-btn" disabled>開始專注模式</button>
                <button class="btn btn-stop" id="stop-btn" style="display: none;">結束 Session</button>
            </div>

            <div class="card" style="text-align: left; font-size: 0.75rem; color: #6b7280;">
                📢 系統會每隔一段時間語音播報指數。<br>
                📱 手機監測已開啟動態追蹤。
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const focusScoreDisplay = document.getElementById('focus-index');
        const xpDisplay = document.getElementById('xp-points');
        const levelDisplay = document.getElementById('user-level');
        const phoneWarning = document.getElementById('phone-warning');
        const loadingOverlay = document.getElementById('loading-overlay');

        let totalFrames = 0;
        let focusedFrames = 0;
        let xpPoints = 0;
        let phoneModel;
        let currentPhoneBox = null;
        let isMonitoring = false;
        let lastSpeakTime = 0;
        let camera = null;

        // 語音播報設定 (毫秒，測試建議設為 30000 即 30秒，正式版可改為 15*60*1000)
        const SPEAK_INTERVAL = 30000; 

        async function init() {
            phoneModel = await cocoSsd.load();
            loadingOverlay.style.display = "none";
            startBtn.disabled = false;
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
        
        pose.onResults(async (results) => {
            if (!isMonitoring) return;

            totalFrames++;

            // 1. 手機偵測與框位更新
            if (totalFrames % 5 === 0) {
                const predictions = await phoneModel.detect(videoElement);
                const phone = predictions.find(p => p.class === 'cell phone' && p.score > 0.6);
                currentPhoneBox = phone ? phone.bbox : null;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);

            // 2. 畫骨架
            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00f2ff', lineWidth: 2});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#fff', lineWidth: 1, radius: 2});
            }

            // 3. 處理手機警告及框位跟隨
            if (currentPhoneBox) {
                phoneWarning.style.display = "block";
                // 畫出跟隨手機的紅框 (注意：因為做了鏡像，x軸座標需要轉換)
                canvasCtx.strokeStyle = "#ef4444";
                canvasCtx.lineWidth = 4;
                canvasCtx.strokeRect(currentPhoneBox[0], currentPhoneBox[1], currentPhoneBox[2], currentPhoneBox[3]);
            } else {
                focusedFrames++;
                phoneWarning.style.display = "none";
                // 專注時加 XP (每秒約加 1-2 分)
                if (totalFrames % 30 === 0) {
                    xpPoints += 5;
                    updateAchievements();
                }
            }

            let focusIndex = Math.round((focusedFrames / totalFrames) * 100);
            focusScoreDisplay.innerText = focusIndex + "%";

            // 4. 定時語音播報
            let now = Date.now();
            if (now - lastSpeakTime > SPEAK_INTERVAL) {
                speakScore(focusIndex);
                lastSpeakTime = now;
            }

            canvasCtx.restore();
        });

        function updateAchievements() {
            xpDisplay.innerText = xpPoints;
            if (xpPoints > 1000) {
                levelDisplay.innerText = "LV.3 FOCUS MASTER";
                levelDisplay.style.background = "#8b5cf6";
            } else if (xpPoints > 500) {
                levelDisplay.innerText = "LV.2 ELITE";
                levelDisplay.style.background = "#3b82f6";
            }
        }

        function speakScore(score) {
            const text = `MindShield 提醒你，你目前的專注指數係百分之 ${score}。`;
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-HK';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        startBtn.onclick = () => {
            isMonitoring = true;
            startBtn.style.display = "none";
            stopBtn.style.display = "block";
            lastSpeakTime = Date.now();
            if (!camera) {
                camera = new Camera(videoElement, {
                    onFrame: async () => { if(isMonitoring) await pose.send({image: videoElement}); },
                    width: 640, height: 480
                });
                camera.start();
            }
        };

        stopBtn.onclick = () => {
            isMonitoring = false;
            startBtn.style.display = "block";
            stopBtn.style.display = "none";
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            alert(`專注結束！\n獲得總積分：${xpPoints} XP\n最終專注度：${focusScoreDisplay.innerText}`);
        };

        init();
    </script>
</body>
</html>
