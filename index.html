<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindShield AI - Control Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        body { 
            background-color: #0a1118; 
            color: #00f2ff; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
            margin: 0;
        }

        /* 頂部標題 */
        .header { text-align: center; margin-bottom: 20px; }
        h1 { margin: 0; letter-spacing: 3px; font-weight: 700; }
        .tagline { color: #8b949e; font-size: 0.9rem; }

        /* 主容器 */
        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        #input_video { display: none; }

        /* 畫布區域 */
        .monitor-screen {
            flex: 2;
            position: relative;
            background: #000;
            border-radius: 20px;
            border: 2px solid #1f2937;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        canvas { width: 100%; height: auto; display: block; }

        /* 控制台 */
        .control-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .score-display { font-size: 3.5rem; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }

        /* 按鈕樣式 */
        .btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f2ff 0%, #0066ff 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 242, 255, 0.5); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

        .btn-stop {
            background: transparent;
            border: 2px solid #ff4d4d;
            color: #ff4d4d;
            margin-top: 10px;
        }

        .btn-stop:hover { background: #ff4d4d; color: #fff; }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            background: #21262d;
        }

        .warning-text { color: #ff4d4d; font-weight: bold; margin-top: 10px; display: none; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 手機適應 */
        @media (max-width: 850px) {
            .main-layout { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MINDSHIELD</h1>
        <div class="tagline">AI Powered Focus Guardian</div>
    </div>

    <div class="main-layout">
        <video id="input_video"></video>
        
        <div class="monitor-screen">
            <div id="placeholder-text" style="position: absolute; color: #30363d; text-align: center;">
                <p>SYSTEM STANDBY</p>
                <small>Ready to monitor your session</small>
            </div>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>

        <div class="control-panel">
            <div class="card">
                <div class="status-badge" id="ai-status">MODELS LOADING...</div>
                <div style="font-size: 0.8rem; color: #8b949e; margin-bottom: 5px;">CURRENT FOCUS INDEX</div>
                <div class="score-display" id="focus-index">0%</div>
                <div id="phone-warning" class="warning-text">⚠️ DETECTED PHONE</div>
            </div>

            <div class="card" style="background: transparent; border: none; padding: 0;">
                <button class="btn btn-primary" id="start-btn" disabled>Start Monitoring</button>
                <button class="btn btn-stop" id="stop-btn" style="display: none;">End Session</button>
            </div>

            <div class="card" style="font-size: 0.75rem; color: #8b949e; text-align: left;">
                • <b>Privacy:</b> 100% On-device processing.<br>
                • <b>Detection:</b> Posture + Object recognition.<br>
                • <b>Goal:</b> Keep Focus Index > 80%.
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const aiStatus = document.getElementById('ai-status');
        const focusScoreDisplay = document.getElementById('focus-index');
        const phoneWarning = document.getElementById('phone-warning');
        const placeholder = document.getElementById('placeholder-text');

        let totalFrames = 0;
        let focusedFrames = 0;
        let phoneModel;
        let isPhonePresent = false;
        let isMonitoring = false;
        let camera = null;

        // 1. 初始化 AI 模型
        async function initAI() {
            try {
                phoneModel = await cocoSsd.load();
                aiStatus.innerText = "SYSTEM READY";
                aiStatus.style.color = "#00f2ff";
                startBtn.disabled = false;
            } catch (e) {
                aiStatus.innerText = "ERROR LOADING MODELS";
            }
        }

        // 2. Pose 檢測邏輯
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
        
        pose.onResults(async (results) => {
            if (!isMonitoring) return;

            totalFrames++;

            // 電話檢測
            if (totalFrames % 6 === 0) {
                const predictions = await phoneModel.detect(videoElement);
                isPhonePresent = predictions.some(p => p.class === 'cell phone' && p.score > 0.6);
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);

            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00f2ff', lineWidth: 2});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#fff', lineWidth: 1, radius: 2});
                
                if (!isPhonePresent) {
                    focusedFrames++;
                    phoneWarning.style.display = "none";
                } else {
                    phoneWarning.style.display = "block";
                    canvasCtx.strokeStyle = "#ff4d4d";
                    canvasCtx.lineWidth = 5;
                    canvasCtx.strokeRect(100, 100, 440, 280); 
                }
            }

            let focusIndex = Math.round((focusedFrames / totalFrames) * 100);
            focusScoreDisplay.innerText = focusIndex + "%";
            canvasCtx.restore();
        });

        // 3. 按鈕事件
        startBtn.onclick = () => {
            isMonitoring = true;
            placeholder.style.display = "none";
            startBtn.style.display = "none";
            stopBtn.style.display = "block";
            aiStatus.innerText = "LIVE MONITORING";
            aiStatus.style.color = "#00ff88";

            // 重置數據
            totalFrames = 0;
            focusedFrames = 0;
            focusScoreDisplay.innerText = "0%";

            if (!camera) {
                camera = new Camera(videoElement, {
                    onFrame: async () => { if(isMonitoring) await pose.send({image: videoElement}); },
                    width: 640, height: 480
                });
                camera.start();
            }
        };

        stopBtn.onclick = () => {
            isMonitoring = false;
            placeholder.style.display = "block";
            startBtn.style.display = "block";
            stopBtn.style.display = "none";
            aiStatus.innerText = "SESSION ENDED";
            aiStatus.style.color = "#8b949e";
            
            // 結束後清除畫布
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            alert(`Session Complete!\nFinal Focus Index: ${focusScoreDisplay.innerText}`);
        };

        initAI();
    </script>
</body>
</html>
